<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Secret Gallery</title>
<link rel="stylesheet" href="secret.css">
</head>
<body>

<div id="loadingScreen" style="display:none;">
    <div class="loaderBox">
        <h2>🔓 Unlocking Secret Gallery...</h2>
        <p>Loading 375 Beautiful Memories ❤️</p>
        <div class="loaderBar">
            <div id="loaderFill"></div>
        </div>
        <p id="loaderText">0%</p>
    </div>
</div>

<div class="container">
    <h1>🔒 Secret Gallery</h1>

    <p class="subtitle">
        এখানে এমন কিছু ছবি আছে যা আমি শুধু তোমার জন্যই রেখে দিয়েছি... ❤️
    </p>

    <div class="lock-box">
        <h2>একটা প্রশ্নের উত্তর দাও...</h2>

        <p><strong>আমি তোমাকে কী নামে ডাকতাম?</strong></p>

        <input
            type="text"
            id="password"
            placeholder="তোমার উত্তর লিখো..."
            autocomplete="off">

        <p id="hint">💡 Hint: তোমার নিকনেম কী দিছিলাম?</p>

        <br><br>

        <button id="unlockButton" onclick="checkPassword()">
            🔓 Unlock
        </button>

        <p id="message"></p>
    </div>
</div>

<script src="secret.js?v=600"></script>
</body>
</html>
